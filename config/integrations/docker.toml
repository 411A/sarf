# Docker / containerd integration descriptor (declarative, no executable hooks).
id = "docker"
name = "Docker Engine"
category = "container_runtime"
executables = ["docker", "dockerd", "containerd", "containerd-shim", "docker-containerd"]
comm = ["dockerd", "containerd"]
description = "Container discovery, metadata, lifecycle events and bounded logs through the local Engine API, with a bounded CLI fallback. Never required for baseline process accounting."
default_enabled = true
capabilities = ["engine_api", "container_lifecycle", "container_events", "process_enrichment", "log_source"]

[[roles]]
label = "docker daemon"
comm_contains = ["dockerd"]

[[roles]]
label = "containerd"
comm_contains = ["containerd"]

[[roles]]
label = "docker CLI"
executables = []
comm_contains = ["docker"]
