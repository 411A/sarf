# Docker / containerd integration descriptor (declarative, no executable hooks).
id = "docker"
name = "Docker Engine"
category = "container_runtime"
executables = ["docker", "dockerd", "containerd", "containerd-shim", "docker-containerd"]
comm = ["dockerd", "containerd"]
description = "Container discovery, names/images from bounded CLI metadata, and lifecycle correlation. Never required for baseline process accounting."
default_enabled = true
capabilities = ["container_lifecycle", "process_enrichment", "log_source"]

[[roles]]
label = "docker daemon"
comm_contains = ["dockerd"]

[[roles]]
label = "containerd"
comm_contains = ["containerd"]

[[roles]]
label = "docker CLI"
executables = []
comm_contains = ["docker"]
