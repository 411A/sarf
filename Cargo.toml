[package]
name = "sarf"
version = "0.1.8"
edition = "2021"
rust-version = "1.88"
description = "SARF — lightweight Linux process, service and activity forensics"
license = "MIT"
repository = "https://github.com/411A/sarf"
readme = "README.md"
keywords = ["linux", "monitoring", "forensics", "procfs", "cgroups"]
categories = ["command-line-utilities", "os::linux-apis"]
default-run = "sarf"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6.6", features = ["derive"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.1.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"
non_ascii_idents = "deny"

[lints.clippy]
# Strict baseline requested by the project: pedantic + nursery are enabled, with a
# small documented allow-list below for lints that do not fit a metrics/forensics
# codebase or would force non-idiomatic APIs.
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
# Pragmatic, low-noise correctness lints.
unwrap_used = "warn"
expect_used = "warn"
manual_let_else = "warn"
redundant_clone = "warn"
# Metric code converts kernel counters and percentages deliberately; every conversion
# is bounded at the SQLite/storage boundary or produces a finite f64 for display.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
# Module/type names intentionally repeat the domain (`cgroup::CgroupSample`) so the
# public API reads clearly at call sites.
module_name_repetitions = "allow"
# We document fallible public APIs in prose at the module level and in tests; the
# error enum is self-describing and this lint would duplicate every doc comment.
missing_errors_doc = "allow"
# Numeric code uses many short local names (`hz`, `pct`, `usec`) for unit clarity.
similar_names = "allow"
# Several commands are intentionally linear formatters; splitting them would add
# indirection without reducing complexity.
too_many_lines = "allow"
# Report/daemon structs mirror the external JSON schema, which has many booleans.
struct_excessive_bools = "allow"
# Generated CLI/report structs intentionally expose `into_iter`-less plain data.
must_use_candidate = "allow"
# Log/text parsing matches on many short ASCII bytes; byte indexing is intentional.
items_after_statements = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Distribution profile used by the GitHub release workflow. It trades extra build
# time for the smallest practical static binary; normal `--release` keeps the
# faster thin-LTO profile used by the test/perf pyramid.
[profile.dist]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.perf]
inherits = "release"
debug = false
