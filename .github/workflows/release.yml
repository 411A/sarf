name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  build:
    name: Static Linux binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          test "v${version}" = "${GITHUB_REF_NAME}" || {
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version v${version}" >&2
            exit 1
          }

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential musl-tools pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build static binary
        env:
          CC: musl-gcc
          RUSTFLAGS: "-C linker=musl-gcc"
        run: cargo build --locked --profile dist --target ${{ matrix.target }}

      - name: Verify and stage artifact
        run: |
          set -eu
          bin="target/${{ matrix.target }}/dist/sarf"
          "$bin" --version
          file "$bin"
          if ! file "$bin" | grep -qi static; then
            echo "release binary is not statically linked" >&2
            exit 1
          fi
          size=$(stat -c '%s' "$bin")
          echo "binary size: ${size} bytes"
          if [ "$size" -gt 20971520 ]; then
            echo "release binary exceeds the 20 MiB ceiling" >&2
            exit 1
          fi
          mkdir -p dist
          cp "$bin" "dist/sarf-${{ matrix.target }}"
          chmod 0755 "dist/sarf-${{ matrix.target }}"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: sarf-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: sarf-*
          path: dist
          merge-multiple: true

      - name: Build checksums
        run: |
          cd dist
          sha256sum sarf-* > SHA256SUMS
          cat SHA256SUMS

      - name: Attest release artifacts
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/sarf-*"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "SARF $GITHUB_REF_NAME" \
              --generate-notes
          fi
