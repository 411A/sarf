name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  linux:
    name: Linux (glibc)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build all targets
        run: cargo build --locked --all-targets

      - name: Unit tests
        run: cargo test --locked --lib

      - name: Policy tests
        run: cargo test --locked --test policy

      - name: Plan conformance tests
        run: cargo test --locked --test plan_conformance

      - name: Collector integration tests
        run: cargo test --locked --test integration_collectors

      - name: Report integration tests
        run: cargo test --locked --test integration_report

      - name: End-to-end tests
        run: cargo test --locked --test e2e

      - name: Performance tests (release)
        run: cargo test --release --locked --test perf -- --nocapture

      - name: Build release binary
        run: cargo build --release --locked

      - name: Upload Linux binary
        uses: actions/upload-artifact@v7
        with:
          name: sarf-linux-x86_64
          path: target/release/sarf
          if-no-files-found: error

      - name: Upload e2e reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sarf-e2e-reports
          path: sarf-data/reports/*.html
          if-no-files-found: ignore

  linux-musl:
    name: Linux (static musl, dist profile)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential musl-tools pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: musl-dist

      - name: Build static binary (dist profile)
        env:
          CC: musl-gcc
          RUSTFLAGS: "-C linker=musl-gcc"
        run: cargo build --locked --profile dist --target x86_64-unknown-linux-musl

      - name: Smoke test and size report
        run: |
          bin=target/x86_64-unknown-linux-musl/dist/sarf
          "$bin" --version
          file "$bin"
          stat -c 'size=%s bytes' "$bin"

      - name: Upload musl binary
        uses: actions/upload-artifact@v7
        with:
          name: sarf-linux-x86_64-musl
          path: target/x86_64-unknown-linux-musl/dist/sarf
          if-no-files-found: error

  windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # e2e and perf are Linux-runtime tests; the linux job above owns them.
      - name: Platform note
        run: Write-Host "Skipping tests/e2e.rs and tests/perf.rs on Windows; covered by the linux job."

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --locked --lib

      - name: Policy tests
        run: cargo test --locked --test policy

      - name: Plan conformance tests
        run: cargo test --locked --test plan_conformance

      - name: Collector integration tests
        run: cargo test --locked --test integration_collectors

      - name: Report integration tests
        run: cargo test --locked --test integration_report
